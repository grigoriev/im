<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Benutzer · Rechnungen</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="min-h-screen bg-base-200 text-base-content font-sans">
<div th:replace="~{fragments/layout :: shell(null, 'users', ~{::content})}">
  <div th:fragment="content" class="grid gap-4">
    <div th:replace="~{fragments/page :: pageHead('Benutzer', null, null)}"></div>
    <output class="alert alert-success text-sm" th:if="${success}" th:text="${success}">OK</output>
    <div role="alert" class="alert alert-error text-sm" th:if="${error}" th:text="${error}">Fehler</div>

    <section id="user-list" class="bg-base-100 rounded-box border border-base-300 shadow-xs divide-y divide-base-300">
      <div th:each="user : ${users}" class="p-4 grid gap-3 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">
        <div class="min-w-0">
          <div class="font-medium [overflow-wrap:anywhere]" th:text="${user.displayName}">Name</div>
          <div class="text-xs text-base-content/75 flex flex-wrap gap-x-3">
            <span th:text="${user.username}">login</span>
            <span th:text="${user.role.name() == 'ADMIN'} ? 'Admin' : 'Benutzer'">Rolle</span>
            <span th:text="${passkeyCounts[user.username]} + ' Passkey(s)'">0 Passkeys</span>
          </div>
        </div>
        <div class="row-actions">
          <button type="button" class="btn" th:attr="data-dialog='password-dialog-' + ${user.id}"><i data-lucide="key-round" class="size-4"></i>Passwort setzen</button>
          <form th:if="${passkeyCounts[user.username] > 0}" th:action="@{/admin/users/{id}/passkeys/delete(id=${user.id})}" method="post">
            <button type="submit" class="btn btn-danger"><i data-lucide="trash-2" class="size-4"></i>Passkeys entfernen</button>
          </form>
          <button type="button" class="btn btn-danger" th:unless="${user.username == #authentication.name}"
                  th:attr="data-dialog='delete-dialog-' + ${user.id}"><i data-lucide="user-x" class="size-4"></i>Löschen</button>
        </div>
        <dialog class="modal" th:id="'delete-dialog-' + ${user.id}" th:attr="aria-labelledby='delete-dialog-' + ${user.id} + '-title'"
                th:unless="${user.username == #authentication.name}">
          <div class="modal-box">
            <div th:replace="~{fragments/dialog :: dialogTitle('delete-dialog-' + ${user.id}, 'Benutzer ' + ${user.username} + ' löschen?')}"></div>
            <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post">
              <div class="modal-body"><p class="text-sm">Das Konto, seine Passkeys und „Angemeldet bleiben“ werden gelöscht.
                Laufende Anmeldungen enden. Das Protokoll behält den Benutzernamen.</p></div>
              <div class="modal-foot">
                <button type="button" class="btn" data-close>Abbrechen</button>
                <button type="submit" class="btn btn-error"><i data-lucide="user-x" class="size-4"></i>Endgültig löschen</button>
              </div>
            </form>
          </div>
          <form th:replace="~{fragments/dialog :: dialogBackdrop}"></form>
        </dialog>
        <dialog class="modal" th:id="'password-dialog-' + ${user.id}" th:attr="aria-labelledby='password-dialog-' + ${user.id} + '-title'">
          <div class="modal-box">
            <div th:replace="~{fragments/dialog :: dialogTitle('password-dialog-' + ${user.id}, 'Neues Passwort für ' + ${user.displayName})}"></div>
            <form th:action="@{/admin/users/{id}/password(id=${user.id})}" method="post">
              <div class="modal-body">
                <label class="floating-label"><span>Neues Passwort</span>
                  <input th:id="'password-' + ${user.id}" name="password" type="password" class="input w-full" autocomplete="new-password" minlength="12" required>
                </label>
                <label class="floating-label"><span>Neues Passwort wiederholen</span>
                  <input th:id="'confirm-' + ${user.id}" name="confirm" type="password" class="input w-full" autocomplete="new-password" minlength="12" required>
                </label>
              </div>
              <div class="modal-foot">
                <button type="button" class="btn" data-close>Abbrechen</button>
                <button type="submit" class="btn btn-primary"><i data-lucide="check" class="size-4"></i>Passwort setzen</button>
              </div>
            </form>
          </div>
          <form th:replace="~{fragments/dialog :: dialogBackdrop}"></form>
        </dialog>
      </div>
    </section>

    <section class="bg-base-100 rounded-box border border-base-300 shadow-xs p-5 grid gap-3">
      <h2 class="font-semibold">Neuer Benutzer</h2>
      <form class="grid gap-3 sm:grid-cols-2" th:action="@{/admin/users}" method="post">
        <label class="floating-label"><span>Benutzername</span>
          <input id="new-username" name="username" class="input w-full" th:value="${username}" autocomplete="off" pattern="[a-z0-9._\-]{3,32}" required>
        </label>
        <label class="floating-label"><span>Name</span>
          <input id="new-display-name" name="displayName" class="input w-full" th:value="${displayName}" maxlength="128" required>
        </label>
        <label class="floating-label"><span>Passwort</span>
          <input id="new-password" name="password" type="password" class="input w-full" autocomplete="new-password" minlength="12" required>
        </label>
        <label class="floating-label"><span>Passwort wiederholen</span>
          <input id="new-confirm" name="confirm" type="password" class="input w-full" autocomplete="new-password" minlength="12" required>
        </label>
        <label class="floating-label"><span>Rolle</span>
          <select id="new-role" name="role" class="select w-full">
            <option value="USER" selected>Benutzer</option>
            <option value="ADMIN">Admin</option>
          </select>
        </label>
        <div class="form-actions sm:col-span-2"><button type="submit" class="btn btn-primary"><i data-lucide="user-plus" class="size-4"></i>Anlegen</button></div>
      </form>
    </section>
  </div>
</div>
</body>
</html>
