<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Länder · Rechnungen</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="min-h-screen bg-base-200 text-base-content font-sans">
<div th:replace="~{fragments/layout :: shell('Einstellungen', 'settings', ~{::content})}">
  <div th:fragment="content" class="max-w-4xl mx-auto grid gap-4">
    <h1 class="text-2xl font-semibold tracking-tight">Einstellungen</h1>
    <div th:replace="~{fragments/settings :: tabs('countries')}"></div>
    <output class="alert alert-success text-sm" th:if="${success}" th:text="${success}">OK</output>
    <div role="alert" class="alert alert-error text-sm" th:if="${error}" th:text="${error}">Fehler</div>

    <section class="bg-base-100 rounded-box border border-base-300 p-5 grid gap-4 @container">
      <div>
        <h2 class="font-semibold">Länder</h2>
        <p class="text-sm text-base-content/75">Diese Länder stehen in den Formularen zur Auswahl. Ein Kunde behält sein Land,
          auch wenn es hier fehlt.</p>
      </div>
      <form class="flex flex-wrap gap-2 items-end" th:action="@{/admin/laender}" method="post">
        <label class="floating-label grow"><span>Land hinzufügen</span>
          <select id="country-add" name="code" class="select w-full">
            <option th:each="country : ${others}" th:value="${country.code}" th:text="${country.name}">Japan</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Hinzufügen</button>
      </form>
      <ul id="country-list" class="grid gap-2 @lg:grid-cols-2 @3xl:grid-cols-3">
        <li th:each="country : ${enabled}" class="border border-base-300 rounded-field px-3 py-2 flex items-center gap-2">
          <span class="flex-1 min-w-0 truncate" th:text="${country.name}">Deutschland</span>
          <span class="text-xs text-base-content/75 font-mono" th:text="${country.code}">DE</span>
          <form th:action="@{/admin/laender/{code}/entfernen(code=${country.code})}" method="post">
            <button type="submit" class="btn btn-xs btn-ghost" th:attr="aria-label=${country.name} + ' entfernen'">
              <i data-lucide="x" class="size-3.5"></i>
            </button>
          </form>
        </li>
      </ul>
    </section>
  </div>
</div>
</body>
</html>
