<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Steuerhinweise · Rechnungen</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="min-h-screen bg-base-200 text-base-content font-sans">
<div th:replace="~{fragments/layout :: shell('Einstellungen', 'settings', ~{::content})}">
  <div th:fragment="content" class="max-w-4xl mx-auto grid gap-4">
    <h1 class="text-2xl font-semibold tracking-tight">Einstellungen</h1>
    <div th:replace="~{fragments/settings :: tabs('tax-notes')}"></div>
    <output class="alert alert-success text-sm" th:if="${success}" th:text="${success}">OK</output>
    <div role="alert" class="alert alert-error text-sm" th:if="${error}" th:text="${error}">Fehler</div>

    <form class="bg-base-100 rounded-box border border-base-300 p-5 grid gap-4" th:action="@{/admin/steuerhinweise}" method="post">
      <div>
        <h2 class="font-semibold">Standard-Steuerhinweise</h2>
        <p class="text-sm text-base-content/75">Vorgabe für neue Vorlagen. Vorlage und Rechnung können den Text überschreiben.
          Ein leeres Feld stellt den ursprünglichen Text wieder her.</p>
      </div>
      <label class="floating-label" th:each="entry : ${notes}"><span th:text="${titles[entry.key]}">Kategorie</span>
        <textarea th:id="'note-' + ${entry.key}" th:name="'note-' + ${entry.key}" class="textarea w-full h-16" maxlength="500"
                  th:text="${entry.value}">Hinweis</textarea>
      </label>
      <div><button type="submit" class="btn btn-primary">Speichern</button></div>
    </form>
  </div>
</div>
</body>
</html>
