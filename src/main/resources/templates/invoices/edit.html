<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Rechnung · Rechnungen</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="min-h-screen bg-base-200 text-base-content font-sans">
<div th:replace="~{fragments/layout :: shell('Rechnung', 'invoices', ~{::content})}">
  <div th:fragment="content" class="max-w-5xl mx-auto grid gap-4">
    <a th:href="@{/rechnungen}" class="link link-hover text-sm text-base-content/75 w-fit">← Rechnungen</a>
    <div>
      <div class="text-xs uppercase tracking-wider text-base-content/75" th:text="${invoice.status.label}">Entwurf</div>
      <h1 class="text-2xl font-semibold tracking-tight [overflow-wrap:anywhere]" th:text="${customer}">Kunde</h1>
    </div>
    <output class="alert alert-success text-sm" th:if="${success}" th:text="${success}">OK</output>
    <div role="alert" class="alert alert-error text-sm grid gap-1" th:if="${formProblems}">
      <span th:each="problem : ${formProblems}" th:text="${problem}">Fehler</span>
    </div>
    <p class="alert text-sm" th:unless="${invoice.draft}">Diese Rechnung ist ausgestellt und ändert sich nicht mehr.</p>

    <form th:if="${invoice.draft}" class="grid gap-4" th:action="@{/rechnungen/{id}(id=${invoice.id})}" th:object="${form}" method="post">
      <input type="hidden" th:field="*{version}">
      <section class="bg-base-100 rounded-box border border-base-300 p-5 grid gap-3 @container">
        <h2 class="font-semibold">Rechnungsdaten</h2>
        <label class="floating-label"><span>E-Rechnungsformat</span>
          <select id="invoice-format" th:field="*{format}" class="select w-full">
            <option th:each="format : ${formatOrder}" th:value="${format}" th:text="${formats.get(format)}">Format</option>
          </select>
        </label>
        <div class="grid gap-3 @lg:grid-cols-2">
          <label class="floating-label"><span>Rechnungsdatum</span>
            <input id="invoice-date" th:field="*{issueDate}" type="date" class="input w-full" required>
          </label>
          <label class="floating-label"><span>Zahlungsziel in Tagen</span>
            <input id="invoice-payment-days" th:field="*{paymentDays}" type="number" min="0" max="365" class="input w-full" required>
          </label>
          <label class="floating-label"><span>Leistung von</span>
            <input id="invoice-from" th:field="*{serviceFrom}" type="date" class="input w-full" required>
          </label>
          <label class="floating-label"><span>Leistung bis</span>
            <input id="invoice-to" th:field="*{serviceTo}" type="date" class="input w-full" required>
          </label>
        </div>
        <label class="floating-label"><span>Käuferreferenz (Leitweg-ID)</span>
          <input id="invoice-reference" th:field="*{buyerReference}" class="input w-full" maxlength="200">
        </label>
      </section>

      <section class="bg-base-100 rounded-box border border-base-300 p-5 grid gap-4 @container" id="positionen">
        <label class="grid gap-1.5"><span class="text-sm font-medium">Einleitung</span>
          <textarea id="invoice-intro" th:field="*{intro}" class="textarea w-full h-20" maxlength="2000"></textarea>
        </label>

        <th:block th:replace="~{fragments/lines :: lines(~{::#invoice-totals})}">
          <div class="text-right" th:if="${document != null}" id="invoice-totals">
            <div class="text-sm num" th:if="${!document.vatAmounts().isEmpty()}"
                 th:text="'Netto ' + ${#numbers.formatDecimal(document.netTotal(), 1, 'POINT', 2, 'COMMA')} + ' €'">Netto</div>
            <div class="text-sm num" th:each="vat : ${document.vatAmounts()}"
                 th:text="'USt ' + ${#numbers.formatDecimal(vat.rate, 1, 0)} + ' % ' + ${#numbers.formatDecimal(vat.vat, 1, 'POINT', 2, 'COMMA')} + ' €'">USt</div>
            <div class="text-xs text-base-content/75">Gesamtbetrag</div>
            <div class="text-xl font-semibold num" th:text="${#numbers.formatDecimal(document.total(), 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</div>
          </div>
        </th:block>

        <label class="grid gap-1.5"><span class="text-sm font-medium">Steuerhinweis</span>
          <textarea id="invoice-tax-note" th:field="*{taxNote}" class="textarea w-full h-16" maxlength="1000"></textarea>
        </label>
        <label class="grid gap-1.5"><span class="text-sm font-medium">Schlusstext</span>
          <textarea id="invoice-closing" th:field="*{closing}" class="textarea w-full h-16" maxlength="2000"></textarea>
        </label>
      </section>

      <section class="bg-base-100 rounded-box border border-base-300 p-5 grid gap-2 text-sm" id="invoice-checks">
        <h2 class="font-semibold">Prüfung</h2>
        <p th:if="${problems.isEmpty()}" class="flex items-center gap-2"><i data-lucide="circle-check" class="size-4 text-success"></i>
          Vollständig. Das Ausstellen folgt im nächsten Schritt.</p>
        <ul th:unless="${problems.isEmpty()}" class="grid gap-1">
          <li th:each="problem : ${problems}" class="flex items-start gap-2"><i data-lucide="circle-alert" class="size-4 text-warning shrink-0 mt-0.5"></i>
            <span th:text="${problem}">Problem</span></li>
        </ul>
      </section>

      <div><button type="submit" name="aktion" value="speichern" class="btn btn-primary"><i data-lucide="save" class="size-4"></i>Speichern</button></div>
    </form>

    <details class="border-t border-base-300 pt-4" th:if="${invoice.draft}">
      <summary class="text-sm cursor-pointer w-fit">Entwurf löschen</summary>
      <form class="mt-3 flex flex-wrap items-center gap-3" method="post" th:action="@{/rechnungen/{id}/loeschen(id=${invoice.id})}">
        <span class="text-sm">Der Entwurf wird endgültig gelöscht.</span>
        <button type="submit" class="btn btn-sm btn-error">Entwurf löschen</button>
      </form>
    </details>
  </div>
</div>
</body>
</html>
