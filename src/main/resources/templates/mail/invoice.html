<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title th:text="${subject}">Rechnung</title>
</head>
<!-- The HTML part of the e-mail with an invoice. Mail programs know little CSS: tables and inline styles only, no
     external files, no scripts. The text part of the e-mail carries the same text. -->
<body style="margin:0;padding:0;background-color:#f3f4f6;">
<table role="presentation" style="width:100%;border-collapse:collapse;border-spacing:0;border:0;background-color:#f3f4f6;">
  <tr>
    <td style="padding:24px 12px;text-align:center;">
      <table role="presentation"
             style="width:100%;max-width:600px;margin:0 auto;text-align:left;border-collapse:separate;border-spacing:0;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:8px;border-top:3px solid #155dfc;">
        <tr>
          <td style="padding:28px 28px 8px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#1f2937;overflow-wrap:anywhere;">
            <p th:each="paragraph : ${paragraphs}" style="margin:0 0 14px 0;"><th:block th:each="line, state : ${paragraph}"><span th:text="${line}">Text</span><br th:unless="${state.last}"></th:block></p>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 28px 8px 28px;">
            <table role="presentation"
                   style="width:100%;border-collapse:separate;border-spacing:0;background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;">
              <tr>
                <td colspan="2" style="padding:14px 16px 6px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;color:#111827;"
                    th:text="${heading}">Rechnung 2027-01</td>
              </tr>
              <tr th:each="fact, state : ${facts}">
                <td style="padding:4px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#6b7280;white-space:nowrap;vertical-align:top;width:1%;"
                    th:styleappend="${state.last} ? 'padding-bottom:14px;'" th:text="${fact.label}">Betrag</td>
                <td style="padding:4px 16px 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#111827;font-weight:500;overflow-wrap:anywhere;"
                    th:styleappend="${state.last} ? 'padding-bottom:14px;'" th:text="${fact.value}">400,00 €</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px 28px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#6b7280;">
            <th:block th:each="line, state : ${signature}"><span th:text="${line}" th:style="${state.first} ? 'color:#1f2937;font-weight:600;'">Name</span><br th:unless="${state.last}"></th:block>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
