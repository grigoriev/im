<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Einstellungen</title>
</head>
<body>
<!-- The tabs of "Einstellungen". The admin tabs show for the admin only. -->
<div th:fragment="tabs(active)" role="tablist" class="tabs-line">
  <a role="tab" th:href="@{/einstellungen}"
     th:attr="aria-selected=${active == 'profile'}">Profil</a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/steuerhinweise}" th:attr="aria-selected=${active == 'tax-notes'}">Steuerhinweise<span class="badge badge-xs badge-ghost">Admin</span></a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/nummernkreis}" th:attr="aria-selected=${active == 'numbers'}">Nummernkreis<span class="badge badge-xs badge-ghost">Admin</span></a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/vorjahre}" th:attr="aria-selected=${active == 'baseline'}">Vorjahre<span class="badge badge-xs badge-ghost">Admin</span></a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/e-mail}" th:attr="aria-selected=${active == 'mail'}">E-Mail<span class="badge badge-xs badge-ghost">Admin</span></a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/datensicherung}" th:attr="aria-selected=${active == 'backup'}">Datensicherung<span class="badge badge-xs badge-ghost">Admin</span></a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/laender}" th:attr="aria-selected=${active == 'countries'}">Länder<span class="badge badge-xs badge-ghost">Admin</span></a>
</div>
</body>
</html>
