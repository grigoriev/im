<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Einstellungen</title>
</head>
<body>
<!-- The tabs of "Einstellungen". The admin tabs show for the admin only. -->
<div th:fragment="tabs(active)" role="tablist" class="tabs tabs-border flex-wrap">
  <a role="tab" th:href="@{/einstellungen}" class="tab" th:classappend="${active == 'profile'} ? 'tab-active' : 'text-base-content/75'"
     th:attr="aria-selected=${active == 'profile'}">Profil</a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/steuerhinweise}" class="tab gap-1.5"
     th:classappend="${active == 'tax-notes'} ? 'tab-active' : 'text-base-content/75'" th:attr="aria-selected=${active == 'tax-notes'}">Steuerhinweise<span class="badge badge-xs badge-ghost">Admin</span></a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/nummernkreis}" class="tab gap-1.5"
     th:classappend="${active == 'numbers'} ? 'tab-active' : 'text-base-content/75'" th:attr="aria-selected=${active == 'numbers'}">Nummernkreis<span class="badge badge-xs badge-ghost">Admin</span></a>
  <a sec:authorize="hasRole('ADMIN')" role="tab" th:href="@{/admin/laender}" class="tab gap-1.5"
     th:classappend="${active == 'countries'} ? 'tab-active' : 'text-base-content/75'" th:attr="aria-selected=${active == 'countries'}">Länder<span class="badge badge-xs badge-ghost">Admin</span></a>
</div>
</body>
</html>
