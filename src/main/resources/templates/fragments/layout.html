<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Layout</title>
  <!-- Viewport, styles and scripts of every page. Each page writes its own title. -->
  <th:block th:fragment="assets">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/theme.js}" src="/js/theme.js" defer></script>
    <script th:src="@{/vendor/lucide.min.js}" src="/vendor/lucide.min.js" defer></script>
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
    <script th:src="@{/js/passkeys.js}" src="/js/passkeys.js" defer></script>
  </th:block>
</head>
<body>

<!-- Theme switch: system, light, dark. -->
<fieldset th:fragment="theme" class="join">
  <legend class="sr-only">Darstellung</legend>
  <button type="button" class="btn btn-xs join-item aria-pressed:btn-active" data-theme-set="system" aria-pressed="true" title="System"><i data-lucide="monitor" class="size-3.5"></i><span class="hidden sm:inline">System</span></button>
  <button type="button" class="btn btn-xs join-item aria-pressed:btn-active" data-theme-set="light" aria-pressed="false" title="Hell"><i data-lucide="sun" class="size-3.5"></i><span class="hidden sm:inline">Hell</span></button>
  <button type="button" class="btn btn-xs join-item aria-pressed:btn-active" data-theme-set="dark" aria-pressed="false" title="Dunkel"><i data-lucide="moon" class="size-3.5"></i><span class="hidden sm:inline">Dunkel</span></button>
</fieldset>

<!-- The app shell of docs/mockup: sidebar on desktop, drawer on the phone. -->
<div th:fragment="shell(title, active, content)" class="drawer lg:drawer-open min-h-screen">
  <input id="nav" type="checkbox" class="drawer-toggle" aria-label="Menü">
  <div class="drawer-content flex flex-col min-w-0">
    <header class="navbar bg-base-100 border-b border-base-300 gap-2 px-4 sticky top-0 z-20">
      <label for="nav" class="btn btn-ghost btn-square btn-sm lg:hidden"><i data-lucide="menu" class="size-5"></i><span class="sr-only">Menü öffnen</span></label>
      <div class="flex-1 min-w-0"><span class="font-semibold truncate" th:text="${title}">Seite</span></div>
      <div th:replace="~{fragments/layout :: theme}"></div>
    </header>
    <main class="px-4 py-6 flex-1 min-w-0" th:insert="${content}"></main>
  </div>
  <div class="drawer-side z-30">
    <!-- Closes the drawer on a tap beside it. Screen readers close it with the menu button. -->
    <label for="nav" class="drawer-overlay" aria-hidden="true"><span class="sr-only">Menü schließen</span></label>
    <nav aria-label="Hauptmenü" class="bg-base-100 border-r border-base-300 w-64 min-h-full flex flex-col">
      <div class="px-5 py-5">
        <div class="font-semibold text-lg tracking-tight">Rechnungen</div>
        <div class="text-xs text-base-content/75 [overflow-wrap:anywhere]" th:if="${currentUser != null}" th:text="${currentUser.displayName}">Name</div>
      </div>
      <ul class="menu w-full px-3 gap-0.5">
        <li><a th:href="@{/}" th:classappend="${active == 'home'} ? 'menu-active'"><i data-lucide="layout-dashboard" class="size-4"></i>Übersicht</a></li>
        <li><a th:href="@{/kunden}" th:classappend="${active == 'customers'} ? 'menu-active'"><i data-lucide="contact" class="size-4"></i>Kunden</a></li>
        <li><a th:href="@{/konto}" th:classappend="${active == 'account'} ? 'menu-active'"><i data-lucide="user-round" class="size-4"></i>Mein Konto</a></li>
        <li><a th:href="@{/einstellungen}" th:classappend="${active == 'settings'} ? 'menu-active'"><i data-lucide="sliders-horizontal" class="size-4"></i>Einstellungen</a></li>
        <th:block sec:authorize="hasRole('ADMIN')">
          <li class="menu-title mt-4 text-base-content/75">Verwaltung</li>
          <li><a th:href="@{/admin/benutzer}" th:classappend="${active == 'users'} ? 'menu-active'"><i data-lucide="users" class="size-4"></i>Benutzer</a></li>
        </th:block>
      </ul>
      <form class="mt-auto p-4" th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-ghost w-full justify-start"><i data-lucide="log-out" class="size-4"></i>Abmelden</button>
      </form>
    </nav>
  </div>
</div>

</body>
</html>
