<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Layout</title>
  <!-- Viewport, icons, styles and scripts of every page. Each page writes its own title. -->
  <th:block th:fragment="assets">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" th:href="@{/manifest.webmanifest}" href="/manifest.webmanifest">
    <link rel="icon" th:href="@{/favicon.ico}" href="/favicon.ico" sizes="32x32">
    <link rel="icon" th:href="@{/favicon.svg}" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Rechnungen">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script th:src="@{/js/theme.js}" src="/js/theme.js" defer></script>
    <script th:src="@{/vendor/lucide.min.js}" src="/vendor/lucide.min.js" defer></script>
    <script th:src="@{/js/app.js}" src="/js/app.js" defer></script>
    <script th:src="@{/js/passkeys.js}" src="/js/passkeys.js" defer></script>
  </th:block>
</head>
<body>

<!-- Theme switch: system, light, dark. -->
<fieldset th:fragment="theme" class="join">
  <legend class="sr-only">Darstellung</legend>
  <button type="button" class="btn join-item aria-pressed:btn-active" data-theme-set="system" aria-pressed="true" title="System"><i data-lucide="monitor" class="size-4"></i><span class="hidden sm:inline">System</span></button>
  <button type="button" class="btn join-item aria-pressed:btn-active" data-theme-set="light" aria-pressed="false" title="Hell"><i data-lucide="sun" class="size-4"></i><span class="hidden sm:inline">Hell</span></button>
  <button type="button" class="btn join-item aria-pressed:btn-active" data-theme-set="dark" aria-pressed="false" title="Dunkel"><i data-lucide="moon" class="size-4"></i><span class="hidden sm:inline">Dunkel</span></button>
</fieldset>

<!-- The app shell of docs/mockup: sidebar on desktop, drawer on the phone. -->
<div th:fragment="shell(title, active, content)" class="drawer lg:drawer-open min-h-screen">
  <input id="nav" type="checkbox" class="drawer-toggle" aria-label="Menü">
  <div class="drawer-content flex flex-col min-w-0">
    <header class="navbar toolbar flex-nowrap items-center bg-base-100 border-b border-base-300 gap-2 px-4 sticky top-0 z-20">
      <label for="nav" class="btn btn-square lg:hidden"><i data-lucide="menu" class="size-5"></i><span class="sr-only">Menü öffnen</span></label>
      <div class="flex-1 min-w-0"><span class="font-semibold truncate" th:text="${title}">Seite</span></div>
      <div th:replace="~{fragments/layout :: theme}"></div>
    </header>
    <main class="px-4 py-6 flex-1 min-w-0" th:insert="${content}"></main>
  </div>
  <div class="drawer-side z-30">
    <!-- Closes the drawer on a tap beside it. Screen readers close it with the menu button. -->
    <label for="nav" class="drawer-overlay" aria-hidden="true"><span class="sr-only">Menü schließen</span></label>
    <nav aria-label="Hauptmenü" class="bg-base-100 border-r border-base-300 w-64 min-h-full flex flex-col">
      <div class="px-5 py-5">
        <div class="font-semibold text-lg tracking-tight">Rechnungen</div>
        <div class="text-xs text-base-content/75 [overflow-wrap:anywhere]" th:if="${currentUser != null}" th:text="${currentUser.displayName}">Name</div>
      </div>
      <ul class="menu w-full px-3 gap-0.5">
        <li><a th:href="@{/}" th:classappend="${active == 'home'} ? 'menu-active'"><i data-lucide="layout-dashboard" class="size-4"></i>Übersicht</a></li>
        <li><a th:href="@{/invoices}" th:classappend="${active == 'invoices'} ? 'menu-active'"><i data-lucide="file-text" class="size-4"></i>Rechnungen</a></li>
        <li><a th:href="@{/expenses}" th:classappend="${active == 'expenses'} ? 'menu-active'"><i data-lucide="receipt" class="size-4"></i>Ausgaben</a></li>
        <li><a th:href="@{/customers}" th:classappend="${active == 'customers'} ? 'menu-active'"><i data-lucide="contact" class="size-4"></i>Kunden</a></li>
        <li><a th:href="@{/documents}" th:classappend="${active == 'documents'} ? 'menu-active'"><i data-lucide="folder-archive" class="size-4"></i>Dokumente</a></li>
        <li><a th:href="@{/reports}" th:classappend="${active == 'reports'} ? 'menu-active'"><i data-lucide="chart-column" class="size-4"></i>Berichte</a></li>
        <li><a th:href="@{/account}" th:classappend="${active == 'account'} ? 'menu-active'"><i data-lucide="user-round" class="size-4"></i>Mein Konto</a></li>
        <li><a th:href="@{/settings}" th:classappend="${active == 'settings'} ? 'menu-active'"><i data-lucide="sliders-horizontal" class="size-4"></i>Einstellungen</a></li>
        <th:block sec:authorize="hasRole('ADMIN')">
          <li class="menu-title mt-4 text-base-content/75">Verwaltung</li>
          <li><a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'menu-active'"><i data-lucide="users" class="size-4"></i>Benutzer</a></li>
          <li><a th:href="@{/admin/audit}" th:classappend="${active == 'audit'} ? 'menu-active'"><i data-lucide="scroll-text" class="size-4"></i>Protokoll</a></li>
          <li><a th:href="@{/admin/system}" th:classappend="${active == 'system'} ? 'menu-active'"><i data-lucide="server" class="size-4"></i>System</a></li>
        </th:block>
      </ul>
      <div class="mt-auto p-4 grid gap-2">
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="flex w-full items-center gap-2 rounded-field px-3 py-2 text-sm cursor-pointer hover:bg-base-200"><i data-lucide="log-out" class="size-4"></i>Abmelden</button>
        </form>
        <!-- The version of the app: a release links to its notes, a snapshot names the time of its build. -->
        <p class="px-3 text-xs text-base-content/75 num grid" id="app-version" th:if="${appVersion != null}" data-volatile>
          <a th:if="${appVersion.release()}" class="hover:underline" th:href="${appVersion.releaseUrl()}" target="_blank" rel="noopener"
             th:text="'Version ' + ${appVersion.number}">Version 0.1.12</a>
          <th:block th:unless="${appVersion.release()}">
            <span th:text="'Version ' + ${appVersion.number ?: 'ohne Angabe'}">Version 0.1.13-SNAPSHOT</span>
            <span th:if="${appVersion.builtAt != null}"
                  th:text="'gebaut ' + ${#temporals.format(appVersion.builtAt, 'dd.MM.yyyy, HH:mm', 'Europe/Berlin')}">gebaut 23.11.2026, 06:24</span>
          </th:block>
        </p>
      </div>
    </nav>
  </div>
</div>

</body>
</html>
