<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Übersicht · Rechnungen</title>
  <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body class="min-h-screen bg-base-200 text-base-content font-sans">
<div th:replace="~{fragments/layout :: shell('Übersicht', 'home', ~{::content})}">
  <div th:fragment="content" class="max-w-3xl mx-auto grid gap-4">
    <h1 class="text-2xl font-semibold tracking-tight [overflow-wrap:anywhere]" th:text="'Guten Tag, ' + ${currentUser != null ? currentUser.displayName : #authentication.name}">Guten Tag</h1>
    <section class="bg-base-100 rounded-box border border-base-300 p-5 grid gap-2">
      <h2 class="font-semibold">Der Rechnungsmanager wird gerade aufgebaut.</h2>
      <p class="text-sm text-base-content/80">Ab 2027 erstellen Sie hier E-Rechnungen im Format ZUGFeRD und XRechnung.</p>
    </section>
  </div>
</div>
</body>
</html>
