spring.application.name=im
spring.threads.virtual.enabled=true

spring.datasource.url=${IM_DB_URL:jdbc:postgresql://localhost:5432/im}
spring.datasource.username=${IM_DB_USER:im}
spring.datasource.password=${IM_DB_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

server.error.whitelabel.enabled=false

# The first admin, created at startup while no admin exists (docs/PLAN.md, section 5).
# Set IM_ADMIN_USERNAME and IM_ADMIN_PASSWORD. Set IM_REMEMBER_ME_KEY to a random secret.
im.admin.username=
im.admin.password=
im.remember-me.key=${IM_REMEMBER_ME_KEY:im-remember-me}
server.servlet.session.cookie.same-site=lax
# nginx terminates TLS. Trusting X-Forwarded-Proto gives the session and remember-me cookies the
# Secure flag. The plain-HTTP E2E stack keeps working.
server.forward-headers-strategy=native

# Passkeys belong to the host of the app. On lemming: IM_WEBAUTHN_RP_ID=im.h.g7v.io and
# IM_WEBAUTHN_ALLOWED_ORIGINS=https://im.h.g7v.io (docs/PLAN.md, section 8).
im.webauthn.rp-id=${IM_WEBAUTHN_RP_ID:localhost}
im.webauthn.allowed-origins=${IM_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080}

# Sending by e-mail (docs/PLAN.md, section 7). Without IM_SMTP_HOST the app does not send; the user records the
# dispatch by hand. IM_MAIL_FROM is the sender, IM_MAIL_BCC an optional copy to the seller.
im.mail.host=${IM_SMTP_HOST:}
im.mail.port=${IM_SMTP_PORT:587}
im.mail.username=${IM_SMTP_USERNAME:}
im.mail.password=${IM_SMTP_PASSWORD:}
im.mail.starttls=${IM_SMTP_STARTTLS:true}
im.mail.from=${IM_MAIL_FROM:}
im.mail.bcc=${IM_MAIL_BCC:}
# The health check of the app does not depend on the mail server.
management.health.mail.enabled=false

# The full export carries every document: an import may be large. Only the admin can upload.
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB
