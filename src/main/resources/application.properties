spring.application.name=im
spring.threads.virtual.enabled=true

spring.datasource.url=${IM_DB_URL:jdbc:postgresql://localhost:5432/im}
spring.datasource.username=${IM_DB_USER:im}
spring.datasource.password=${IM_DB_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

server.error.whitelabel.enabled=false

# The first admin, created at startup while no admin exists (docs/PLAN.md, section 5).
# Set IM_ADMIN_USERNAME and IM_ADMIN_PASSWORD. Set IM_REMEMBER_ME_KEY to a random secret.
im.admin.username=
im.admin.password=
im.remember-me.key=${IM_REMEMBER_ME_KEY:im-remember-me}
server.servlet.session.cookie.same-site=lax
# nginx terminates TLS. Trusting X-Forwarded-Proto gives the session and remember-me cookies the
# Secure flag. The plain-HTTP E2E stack keeps working.
server.forward-headers-strategy=native
