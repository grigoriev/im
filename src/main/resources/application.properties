spring.application.name=im
spring.threads.virtual.enabled=true

# The app connects as a role that may only read and write rows (IM_DB_USER). It only checks the schema: the step
# "java -jar im.jar migrate" migrates as the owner of the tables (application-migrate.properties), the only role that
# can switch a trigger off. The app refuses to start as the owner.
spring.datasource.url=${IM_DB_URL:jdbc:postgresql://localhost:5432/im}
spring.datasource.username=${IM_DB_USER:im_app}
spring.datasource.password=${IM_DB_PASSWORD:}
spring.flyway.placeholders.appuser=${spring.datasource.username}

# The key of the seals (HMAC-SHA256) of the documents and snapshots, at least 32 characters. It lives outside the
# database and outside the backups of the database: keep a copy apart from them. Without it no seal matches.
im.integrity.key=${IM_INTEGRITY_KEY:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

server.error.whitelabel.enabled=false

# The first admin, created at startup while no admin exists (docs/PLAN.md, section 5).
# Set IM_ADMIN_USERNAME and IM_ADMIN_PASSWORD. Set IM_REMEMBER_ME_KEY to a random secret of at least 32 characters:
# the app does not start without it.
im.admin.username=
im.admin.password=
im.remember-me.key=${IM_REMEMBER_ME_KEY:}
server.servlet.session.cookie.same-site=lax
# nginx terminates TLS. Trusting X-Forwarded-Proto gives the session and remember-me cookies the
# Secure flag. The plain-HTTP E2E stack keeps working.
server.forward-headers-strategy=native
# The phone reads the manifest of the installed app only with its own media type.
server.mime-mappings.webmanifest=application/manifest+json

# Passkeys belong to the host of the app. On lemming: IM_WEBAUTHN_RP_ID=im.h.g7v.io and
# IM_WEBAUTHN_ALLOWED_ORIGINS=https://im.h.g7v.io (docs/PLAN.md, section 8).
im.webauthn.rp-id=${IM_WEBAUTHN_RP_ID:localhost}
im.webauthn.allowed-origins=${IM_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080}

# Sending by e-mail (docs/PLAN.md, section 7). Without IM_SMTP_HOST the app does not send; the user records the
# dispatch by hand. IM_MAIL_FROM is the sender, IM_MAIL_BCC an optional copy to the seller.
im.mail.host=${IM_SMTP_HOST:}
im.mail.port=${IM_SMTP_PORT:587}
im.mail.username=${IM_SMTP_USERNAME:}
im.mail.password=${IM_SMTP_PASSWORD:}
im.mail.starttls=${IM_SMTP_STARTTLS:true}
im.mail.from=${IM_MAIL_FROM:}
im.mail.bcc=${IM_MAIL_BCC:}
# The health check of the app does not depend on the mail server.
management.health.mail.enabled=false

# The full export carries every document: an import may be large. Only the admin can upload. The upload goes to disk,
# and the import streams it from there, so its size costs no memory. As large as an import expands, so any export fits.
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB
