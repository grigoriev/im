# The E2E stack: database, mail server, the app image under test, and the pinned Playwright image.
# Playwright shares the network of "web" and calls http://localhost:8080: WebAuthn (passkeys) runs only
# in a secure context, and the browser treats localhost as one.
# Start it through scripts/e2e.sh.
# The passwords and keys below exist for this throwaway stack only. NOSONAR marks them for SonarCloud.
services:
  db:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: im
      POSTGRES_USER: im
      POSTGRES_PASSWORD: e2e-only # test only, never reuse NOSONAR
    volumes:
      - ./db/app-role.sql:/docker-entrypoint-initdb.d/app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im -d im"]
      interval: 2s
      retries: 30

  # GreenMail takes every e-mail of the app. Its API on port 8080 lets the tests read them.
  mail:
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.api -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled

  # The migration as the owner of the tables, a step of its own: only it gets the owner's password.
  migrate:
    image: ${IM_IMAGE:-im:test}
    command: ["migrate"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      IM_DB_URL: jdbc:postgresql://db:5432/im
      IM_DB_USER: im_app
      IM_DB_OWNER: im
      IM_DB_OWNER_PASSWORD: e2e-only # test only, never reuse NOSONAR
      IM_INTEGRITY_KEY: e2e-only-integrity-key-0123456789abcdef # test only, never reuse NOSONAR
    depends_on:
      db:
        condition: service_healthy

  # Hardened as in production: a read-only file system, no capabilities. Uploads and Tomcat use /tmp.
  web:
    image: ${IM_IMAGE:-im:test}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      IM_DB_URL: jdbc:postgresql://db:5432/im
      IM_DB_USER: im_app
      IM_DB_PASSWORD: e2e-app-only # test only, never reuse NOSONAR
      IM_INTEGRITY_KEY: e2e-only-integrity-key-0123456789abcdef # test only, never reuse NOSONAR
      IM_ADMIN_USERNAME: admin
      IM_ADMIN_PASSWORD: e2e-admin-passwort # test only, never reuse NOSONAR
      IM_REMEMBER_ME_KEY: e2e-only-remember-me-key-0123456789 # test only, never reuse NOSONAR
      IM_SMTP_HOST: mail
      IM_SMTP_PORT: "3025"
      IM_SMTP_STARTTLS: "false"
      IM_MAIL_FROM: rechnung@e2e.example
      TZ: Europe/Berlin
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    working_dir: /e2e
    network_mode: service:web
    environment:
      BASE_URL: http://localhost:8080
      # The integrity test plays someone with the password of the owner: it changes a document in the database.
      E2E_DB_URL: postgres://im:e2e-only@db:5432/im # test only, never reuse NOSONAR
      CI: ${CI:-}
      PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
    volumes:
      - ./:/e2e
    command: ["bash", "-c", "npm ci --no-audit --no-fund && npx playwright test $$PLAYWRIGHT_ARGS"]
    depends_on:
      - web
