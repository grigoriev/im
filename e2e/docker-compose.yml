# The E2E stack: database, the app image under test, and the pinned Playwright image.
# Playwright shares the network of "web" and calls http://localhost:8080: WebAuthn (passkeys) runs only
# in a secure context, and the browser treats localhost as one.
# Start it through scripts/e2e.sh.
services:
  db:
    image: postgres:18.7-alpine@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    environment:
      POSTGRES_DB: im
      POSTGRES_USER: im
      POSTGRES_PASSWORD: e2e-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im -d im"]
      interval: 2s
      retries: 30

  web:
    image: ${IM_IMAGE:-im:test}
    environment:
      IM_DB_URL: jdbc:postgresql://db:5432/im
      IM_DB_USER: im
      IM_DB_PASSWORD: e2e-only
      IM_ADMIN_USERNAME: admin
      IM_ADMIN_PASSWORD: e2e-admin-passwort
      IM_REMEMBER_ME_KEY: e2e-only
      TZ: Europe/Berlin
    depends_on:
      db:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    working_dir: /e2e
    network_mode: service:web
    environment:
      BASE_URL: http://localhost:8080
      CI: ${CI:-}
      PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
    volumes:
      - ./:/e2e
    command: ["bash", "-c", "npm ci --no-audit --no-fund && npx playwright test $$PLAYWRIGHT_ARGS"]
    depends_on:
      - web
